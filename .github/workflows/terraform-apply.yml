# CourseWright Terraform apply (shared scripts).
#
# Dispatch only. Checks out the matching plan run's git SHA, applies that plan,
# then rebuilds the SPA from Terraform outputs (never the plan-time dist/).
# See docs/HUMAN_NEEDED.md (HN-003, HN-010).

name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      tier:
        description: Environment to apply (testing first; production requires GitHub Environment approval)
        required: true
        type: choice
        default: testing
        options:
          - testing
          - production
      plan_run_id:
        description: Run ID of the matching Terraform Plan (empty = latest successful plan for this tier)
        required: false
        type: string
      deploy_supabase:
        description: Also push migrations + Edge Functions after apply
        required: false
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: terraform-apply-${{ inputs.tier }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ROLE_TO_ASSUME: arn:aws:iam::891612573605:role/github-oidc
  TERRAFORM_VERSION: "1.16.3"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  apply:
    name: Apply (${{ inputs.tier }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.tier }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve matching plan run
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/gha-resolve-plan-run.sh "${{ inputs.tier }}" "${{ inputs.plan_run_id }}"

      - name: Check out plan commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.plan.outputs.sha }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: sts.amazonaws.com
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Supabase CLI
        if: inputs.deploy_supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Download Plan Artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: terraform-plan.yml
          name: terraform-plan-${{ inputs.tier }}
          path: infra/terraform
          run_id: ${{ steps.plan.outputs.run_id }}
          workflow_conclusion: success

      - name: Terraform Apply
        run: ./scripts/tf-apply.sh ${{ inputs.tier }}

      - name: Deploy Supabase
        if: inputs.deploy_supabase
        run: ./scripts/deploy-supabase.sh ${{ inputs.tier }}

      - name: Install Dependencies
        run: npm ci

      - name: Build SPA
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
        run: ./scripts/build-spa.sh ${{ inputs.tier }}

      - name: Sync SPA to S3 and invalidate CloudFront
        run: ./scripts/deploy-spa.sh ${{ inputs.tier }}
