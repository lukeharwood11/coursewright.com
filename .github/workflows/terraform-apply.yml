# CourseWright Terraform apply (shared scripts).
#
# Dispatch only. Requires matching plan artifacts from terraform-plan.yml.
# After apply: SPA sync + optional Supabase migrate/functions via scripts.
# See docs/HUMAN_NEEDED.md (HN-003, HN-010).

name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      tier:
        description: Environment to apply (testing first; production requires GitHub Environment approval)
        required: true
        type: choice
        default: testing
        options:
          - testing
          - production
      plan_run_id:
        description: Run ID of the matching Terraform Plan (empty = latest successful plan for this tier)
        required: false
        type: string
      deploy_supabase:
        description: Also push migrations + Edge Functions after apply
        required: false
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: terraform-apply-${{ inputs.tier }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ROLE_TO_ASSUME: arn:aws:iam::891612573605:role/github-oidc
  TERRAFORM_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  apply:
    name: Apply (${{ inputs.tier }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.tier }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: sts.amazonaws.com
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Setup Supabase CLI
        if: inputs.deploy_supabase
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Download Plan Artifact (specific run)
        if: inputs.plan_run_id != ''
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: terraform-plan.yml
          name: terraform-plan-${{ inputs.tier }}
          path: infra/terraform
          run_id: ${{ inputs.plan_run_id }}
          workflow_conclusion: success

      - name: Download Plan Artifact (latest)
        if: inputs.plan_run_id == ''
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: terraform-plan.yml
          name: terraform-plan-${{ inputs.tier }}
          path: infra/terraform
          workflow_conclusion: success

      - name: Download Application Artifact (specific run)
        if: inputs.plan_run_id != ''
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: terraform-plan.yml
          name: application-${{ inputs.tier }}
          path: dist
          run_id: ${{ inputs.plan_run_id }}
          workflow_conclusion: success

      - name: Download Application Artifact (latest)
        if: inputs.plan_run_id == ''
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: terraform-plan.yml
          name: application-${{ inputs.tier }}
          path: dist
          workflow_conclusion: success

      - name: Terraform Apply
        run: ./scripts/tf-apply.sh ${{ inputs.tier }}

      - name: Deploy Supabase
        if: inputs.deploy_supabase
        run: ./scripts/deploy-supabase.sh ${{ inputs.tier }}

      - name: Sync SPA to S3 and invalidate CloudFront
        run: ./scripts/deploy-spa.sh ${{ inputs.tier }}
