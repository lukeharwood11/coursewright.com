# CourseWright Terraform apply (nosh-style, adapted).
#
# DO NOT DISPATCH until Luke’s ISSUED us-east-1 ACM certificate (HN-005) and
# HN-003 AWS/OIDC credentials. This workflow is code-only until those land.
# See docs/HUMAN_NEEDED.md.
#
# After apply, S3 sync + CloudFront invalidate run as Actions steps — not a
# Terraform null_resource.

name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      tier:
        description: Environment to apply (testing first; production requires GitHub Environment approval)
        required: true
        type: choice
        default: testing
        options:
          - testing
          - production
      plan_run_id:
        description: Run ID of the matching Terraform Plan (empty = latest successful plan for this tier)
        required: false
        type: string

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: terraform-apply-${{ inputs.tier }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ROLE_TO_ASSUME: arn:aws:iam::891612573605:role/github-oidc
  TERRAFORM_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  apply:
    name: Apply (${{ inputs.tier }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.tier }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: sts.amazonaws.com
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Download Plan Artifact (specific run)
        if: inputs.plan_run_id != ''
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: terraform-plan.yml
          name: terraform-plan-${{ inputs.tier }}
          path: infra/terraform
          run_id: ${{ inputs.plan_run_id }}
          workflow_conclusion: success

      - name: Download Plan Artifact (latest)
        if: inputs.plan_run_id == ''
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: terraform-plan.yml
          name: terraform-plan-${{ inputs.tier }}
          path: infra/terraform
          workflow_conclusion: success

      - name: Download Application Artifact (specific run)
        if: inputs.plan_run_id != ''
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: terraform-plan.yml
          name: application-${{ inputs.tier }}
          path: dist
          run_id: ${{ inputs.plan_run_id }}
          workflow_conclusion: success

      - name: Download Application Artifact (latest)
        if: inputs.plan_run_id == ''
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: terraform-plan.yml
          name: application-${{ inputs.tier }}
          path: dist
          workflow_conclusion: success

      - name: Terraform Init and Apply
        working-directory: infra/terraform
        run: |
          terraform init -backend-config=backend-${{ inputs.tier }}.hcl
          terraform apply tf.plan

      # Deploy is Actions, not Terraform. Bucket name from output, with the
      # known coursewright-${tier}-spa fallback if output is empty.
      - name: Sync SPA to S3 and invalidate CloudFront
        working-directory: infra/terraform
        env:
          TIER: ${{ inputs.tier }}
        run: |
          set -euo pipefail
          if [ ! -d "${GITHUB_WORKSPACE}/dist" ]; then
            echo "dist/ artifact missing" >&2
            exit 1
          fi
          BUCKET="$(terraform output -raw spa_bucket_name)"
          DIST_ID="$(terraform output -raw cloudfront_distribution_id)"
          if [ -z "${BUCKET}" ]; then
            BUCKET="coursewright-${TIER}-spa"
            echo "spa_bucket_name output empty; falling back to ${BUCKET}"
          fi
          if [ -z "${DIST_ID}" ]; then
            echo "cloudfront_distribution_id output is empty" >&2
            exit 1
          fi
          aws s3 sync "${GITHUB_WORKSPACE}/dist/" "s3://${BUCKET}" --delete
          aws cloudfront create-invalidation --distribution-id "${DIST_ID}" --paths "/*"
